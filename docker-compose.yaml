services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dealsense-postgres
    environment:
      POSTGRES_DB: dealsense
      POSTGRES_USER: dealsense
      POSTGRES_PASSWORD: dealsense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - joinly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealsense -d dealsense"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Joinly Core MCP Server
  joinly-core:
    image: ghcr.io/joinly-ai/joinly:latest
    container_name: joinly-core
    ports:
      - "8000:8000"
    env_file:
      - .env  # Uses .env from root directory
    environment:
      - PORT=8000
    volumes:
      - joinly_data:/app/data
    networks:
      - joinly-network
    restart: unless-stopped
    
